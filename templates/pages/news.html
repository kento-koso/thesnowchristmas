    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link

    <link rel="stylesheet" href="snow-placeholder.css" />

  <body class="sub site-shell" id="page-top">
    <a class="skip-link" href="#main-content">本文へスキップ</a>
    <!-- shared:header:start -->

    <main id="main-content">
      <section class="subhead">

          <p class="crumb"><a href="./">トップ</a> ／ お知らせ</p>
          <p class="label">News</p>
          <h1>お知らせ</h1>
        </div>
      </section>
      <section class="subbody">
        <div class="wrap">
          <!-- 新しいものを上に足す。トップの「お知らせの帯」も合わせて更新する -->
          <ul class="newslist">
            <li>
              <span>開催のお知らせ</span>
              <p>

                の開催が決まりました。{{event.dateWithoutYear}}、{{event.venue}} で開きます。
              </p>
            </li>
            <li>
              <time>{{event.year}}.11（予定）</time>
              <p>開場時間・時間割、アートワークショップの参加の方法をお知らせします。</p>
            </li>
            <li>
              <time>{{event.year}}.11（予定）</time>
              <p>雪募金の受付をはじめます。</p>
            </li>
          </ul>
        </div>
      </section>
